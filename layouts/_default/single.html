{{ define "main" }}


<article style="max-width: 800px; margin: 40px auto; padding: 0 20px; line-height: 1.8; text-align: left;">
    <h1 style="color: var(--primary-red); font-size: 2.2rem; margin-bottom: 25px;">{{ .Title }}</h1>
    

    
    <div class="page-content" style="color: var(--text-color); font-size: 1.05rem;">
        {{ .Content }}
    </div>
</article>
{{ end }}
