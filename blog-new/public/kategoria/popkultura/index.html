        <script>
        document.addEventListener("DOMContentLoaded", function() {
            const buttons = document.querySelectorAll('.country-tab-btn');
            const sections = document.querySelectorAll('.country-section');

            function switchTab(krajSlug) {
                buttons.forEach(btn => {
                    if(btn.getAttribute('data-kraj') === krajSlug) {
                        btn.style.background = 'var(--primary-red)';
                        btn.style.color = '#fff';
                    } else {
                        btn.style.background = 'var(--tile-bg)';
                        btn.style.color = 'var(--text-color)';
                    }
                });

                sections.forEach(sec => {
                    if(sec.getAttribute('data-kraj-content') === krajSlug) {
                        sec.style.display = 'block';
                    } else {
                        sec.style.display = 'none';
                    }
                });
            }

            if(buttons.length > 0) {
                const urlParams = new URLSearchParams(window.location.search);
                let activeKraj = urlParams.get('kraj');

                if(!activeKraj || !document.querySelector(`[data-kraj="${activeKraj}"]`)) {
                    activeKraj = buttons[0].getAttribute('data-kraj');
                }

                switchTab(activeKraj);

                buttons.forEach(btn => {
                    btn.addEventListener('click', function() {
                        const kraj = this.getAttribute('data-kraj');
                        const newUrl = window.location.pathname + '?kraj=' + kraj;
                        window.history.pushState({path: newUrl}, '', newUrl);
                        switchTab(kraj);
                    });
                });
            }
        });
        </script>
