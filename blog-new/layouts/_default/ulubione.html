{{ define "main" }}
<article class="favorites-page">
    <header class="favorites-header">
        <h1>Twoje ulubione atrakcje w jednym miejscu</h1>
    </header>

    <div class="favorites-notice">
        ℹ️ <strong>Ważna informacja:</strong> Twoje polubione atrakcje są zapisane tylko na tym konkretnym urządzeniu i w tej przeglądarce. Nie są one synchronizowane w chmurze ani między Twoimi różnymi sprzętami.
    </div>

    <div id="favorites-container">
        <p class="no-favorites" id="empty-msg">Ładowanie ulubionych...</p>
    </div>
</article>

<style>
.favorites-page {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
    text-align: left;
}

.favorites-header h1 {
    color: var(--primary-red);
    font-size: 2.2rem;
    margin-bottom: 15px;
}

.favorites-notice {
    background-color: var(--bg-color);
    border: 2px solid #2ecc71;
    border-left: 6px solid #2ecc71;
    padding: 15px 20px;
    border-radius: 8px;
    margin-bottom: 30px;
    color: var(--text-color);
    font-size: 0.95rem;
    box-shadow: 0 2px 5px rgba(0,0,0,0.03);
}

.country-tabs {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 25px;
    border-bottom: 2px solid rgba(0,0,0,0.05);
    padding-bottom: 15px;
}

.country-tab-btn {
    background-color: var(--bg-color);
    color: var(--text-color);
    border: 2px solid rgba(0, 0, 0, 0.1);
    padding: 10px 20px;
    border-radius: 30px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s ease;
}

.country-tab-btn:hover {
    border-color: var(--primary-red);
    color: var(--primary-red);
}

.country-tab-btn.active {
    background-color: var(--primary-red);
    color: #fff;
    border-color: var(--primary-red);
}

.city-section {
    margin-bottom: 25px;
}

.city-title {
    color: var(--primary-red);
    font-size: 1.3rem;
    margin-bottom: 12px;
    padding-bottom: 5px;
    border-bottom: 1px dashed rgba(0,0,0,0.1);
}

.favorites-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 15px;
    margin-bottom: 25px;
}

.favorite-card {
    background-color: var(--tile-bg);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 3px 10px rgba(0,0,0,0.04);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: transform 0.2s ease;
}

.favorite-card:hover {
    transform: translateY(-2px);
}

.favorite-img {
    width: 100%;
    height: 140px;
    object-fit: cover;
}

.favorite-content {
    padding: 15px;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
    justify-content: space-between;
}

.favorite-card a {
    color: var(--primary-red);
    text-decoration: none;
    font-weight: bold;
    font-size: 1.1rem;
    display: block;
    margin-bottom: 6px;
}

.favorite-card a:hover {
    color: var(--hover-color);
}

.favorite-meta {
    font-size: 0.85rem;
    color: rgba(0, 0, 0, 0.6);
    margin-bottom: 12px;
}

.remove-fav-btn {
    background: none;
    border: none;
    color: #e74c3c;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: bold;
    text-align: left;
    padding: 0;
    margin-top: auto;
}

.remove-fav-btn:hover {
    text-decoration: underline;
}

.no-favorites {
    color: var(--text-color);
    font-style: italic;
    padding: 20px 0;
}
</style>

<script>
function loadFavoritesPage() {
    const container = document.getElementById('favorites-container');
    const favorites = JSON.parse(localStorage.getItem('asia_compass_favorites')) || [];

    if (favorites.length === 0) {
        container.innerHTML = '<p class="no-favorites">Nie masz jeszcze żadnych zapisanych ulubionych atrakcji. Przeglądaj strony i kliknij "Dodaj do ulubionych"!</p>';
        return;
    }

    let groupedData = {};

    favorites.forEach(fav => {
        // Normalizacja nazwy kraju (pierwsza litera duża, reszta małe, usuwanie spacji),
        // żeby "Chiny", "chiny" czy "Chiny " lądowały w jednym miejscu.
        let rawCountry = fav.kraj ? fav.kraj.trim() : "Inne";
        let countryKey = rawCountry.charAt(0).toUpperCase() + rawCountry.slice(1).toLowerCase();
        
        let miasto = fav.miasto ? fav.miasto.trim() : "Ogólne";

        if (!groupedData[countryKey]) {
            groupedData[countryKey] = {};
        }
        if (!groupedData[countryKey][miasto]) {
            groupedData[countryKey][miasto] = [];
        }
        groupedData[countryKey][miasto].push(fav);
    });

    let html = '<div class="country-tabs" id="country-tabs"></div><div id="country-content-area"></div>';
    container.innerHTML = html;

    const tabsContainer = document.getElementById('country-tabs');
    const contentArea = document.getElementById('country-content-area');

    let countries = Object.keys(groupedData);
    countries.sort();

    countries.forEach((country, index) => {
        const btn = document.createElement('button');
        btn.className = `country-tab-btn ${index === 0 ? 'active' : ''}`;
        btn.innerText = country;
        btn.onclick = () => switchCountryTab(country, groupedData[country], btn);
        tabsContainer.appendChild(btn);
    });

    if (countries.length > 0) {
        renderCitySections(groupedData[countries[0]], contentArea);
    }
}

function switchCountryTab(countryName, citiesData, clickedBtn) {
    document.querySelectorAll('.country-tab-btn').forEach(b => b.classList.remove('active'));
    clickedBtn.classList.add('active');
    renderCitySections(citiesData, document.getElementById('country-content-area'));
}

function renderCitySections(citiesData, targetContainer) {
    let html = '';
    let cities = Object.keys(citiesData);
    cities.sort();

    cities.forEach(city => {
        html += `<div class="city-section">`;
        html += `<h3 class="city-title">📍 ${city.charAt(0).toUpperCase() + city.slice(1)}</h3>`;
        html += `<div class="favorites-grid">`;

        citiesData[city].forEach(item => {
            let imgTag = item.image_url ? `<img src="${item.image_url}" alt="${item.title}" class="favorite-img" loading="lazy">` : '';
            html += `
                <div class="favorite-card">
                    ${imgTag}
                    <div class="favorite-content">
                        <div>
                            <a href="${item.url}">${item.title}</a>
                            <div class="favorite-meta">Kategoria: ${item.kategoria || 'Atrakcja'}</div>
                        </div>
                        <button class="remove-fav-btn" onclick="removeFavorite('${item.url}')">Usuń z ulubionych</button>
                    </div>
                </div>
            `;
        });

        html += `</div></div>`;
    });

    targetContainer.innerHTML = html;
}

function removeFavorite(url) {
    let favorites = JSON.parse(localStorage.getItem('asia_compass_favorites')) || [];
    favorites = favorites.filter(fav => fav.url !== url);
    localStorage.setItem('asia_compass_favorites', JSON.stringify(favorites));
    loadFavoritesPage();
}

document.addEventListener('DOMContentLoaded', loadFavoritesPage);
</script>
{{ end }}
