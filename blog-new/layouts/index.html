{{ define "main" }}
<!-- Hero Banner -->
<section class="hero-banner">
    <h1>Witaj w Asia Compass</h1>
    <p>Twoja osobista przestrzeń do odkrywania atrakcji w Chinach, Japonii i Korei.</p>
</section>

<!-- Sekcja Kraje -->
<section class="section-container">
    <h2>Odkrywaj Kraje</h2>
    <div class="grid-container">
        <a href="{{ "kraje/chiny/" | relURL }}" class="tile">Chiny</a>
        <a href="{{ "kraje/japonia/" | relURL }}" class="tile">Japonia</a>
        <a href="{{ "kraje/korea/" | relURL }}" class="tile">Korea</a>
    </div>
</section>

<!-- Sekcja Kategorii -->
<section class="section-container">
    <h2>Kategorie</h2>
    <div class="grid-container">
        <a href="{{ "Kategoria/jedzenie/" | relURL }}" class="tile">Jedzenie</a>
        <a href="{{ "Kategoria/nocleg/" | relURL }}" class="tile">Nocleg</a>
        <a href="{{ "Kategoria/hotel/" | relURL }}" class="tile">Hotel</a>
        <a href="{{ "Kategoria/historia/" | relURL }}" class="tile">Historia</a>
        <a href="{{ "Kategoria/popkultura/" | relURL }}" class="tile">Popkultura</a>
    </div>
</section>

<style>
.hero-banner { text-align: center; padding: 40px; }
.section-container { margin-top: 30px; }
.grid-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 15px;
    margin-top: 15px;
}
.tile {
    padding: 20px;
    text-align: center;
    border-radius: 8px;
    font-weight: bold;
    color: #2c3e50;
    text-decoration: none;
}
</style>
{{ end }}
