<script>
function toggleFavorite(url, title) {
    let favorites = JSON.parse(localStorage.getItem('asia_compass_favorites')) || [];
    const index = favorites.findIndex(fav => fav.url === url);
    
    if (index > -1) {
        favorites.splice(index, 1);
    } else {
        const kraj = "Inne".trim();
        const miasto = "Ogólne".trim();
        const kategoria = "Atrakcja".trim();
        const image_url = "https:\/\/images.pexels.com\/photos\/34809836\/pexels-photo-34809836.jpeg";

        favorites.push({ url, title, kraj, miasto, kategoria, image_url });
    }
    localStorage.setItem('asia_compass_favorites', JSON.stringify(favorites));
    updateFavoriteButton();
}

function updateFavoriteButton() {
    const btn = document.getElementById('favorite-btn');
    if (!btn) return;
    
    let favorites = JSON.parse(localStorage.getItem('asia_compass_favorites')) || [];
    
    const currentUrl = "http:\/\/localhost:1313\/blog\/pierwszy-wpis-copy\/";
    const exists = favorites.some(fav => fav.url === currentUrl);

    if (exists) {
        btn.innerText = '❤️ Dodano do ulubionych';
        btn.style.backgroundColor = 'var(--primary-red)';
        btn.style.color = '#fff';
    } else {
        btn.innerText = '⭐ Dodaj do ulubionych';
        btn.style.backgroundColor = 'var(--bg-color)';
        btn.style.color = 'var(--primary-red)';
    }
}

document.addEventListener('DOMContentLoaded', updateFavoriteButton);
</script>
