baseURL = 'https://asiacompass.github.io/asia-compass/'
languageCode = 'pl-pl'
title = 'Asia Compass'

# Taksonomie w liczbie pojedynczej, spójne z folderami i szablonami
[taxonomies]
kraj = "kraj"
miasto = "miasto"
kategoria = "kategoria"
tag = "tag"
country = "country"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[menu]
  # Element nadrzędny (rozwijany)
  [[menu.main]]
    name = "Kraje"
    identifier = "kraje"
    url = "#"
    weight = 1

  # Podmenu - poszczególne kraje
  [[menu.main]]
    name = "Chiny"
    url = "/kraj/chiny/"
    parent = "kraje"
    weight = 1

  [[menu.main]]
    name = "Japonia"
    url = "/kraj/japonia/"
    parent = "kraje"
    weight = 2

  [[menu.main]]
    name = "Korea"
    url = "/kraj/korea/"
    parent = "kraje"
    weight = 3

  # Pozostałe linki menu
  [[menu.main]]
    name = "Blog"
    url = "/blog/"
    weight = 2

  [[menu.main]]
    name = "Sociale"
    url = "/social/"
    weight = 3

  [[menu.main]]
    name = "Ulubione"
    url = "/ulubione/"
    weight = 4
    
[sitemap]
  changefreq = 'weekly'
  priority = 0.5
  filename = 'sitemap.xml'
  uglyURLs = false